name: Monthly CT ingestion sweep
# MONTHLY, not weekly — deliberate cost decision.
#
# Each full sweep is up to ~1,350 paid Google Places requests
# (9 industries x 50 cities x 3 pages). Contractors don't appear or
# vanish weekly, and dedup merges nearly everything a re-sweep returns,
# so weekly was ~4x the cost for near-identical inventory.
#
# Runs the 1st of each month at 6am ET. Can also be fired on demand:
# GitHub → Actions → "Monthly CT ingestion sweep" → Run workflow —
# use that for a new state, a new trade, or a thin hot-lead list.
on:
  schedule:
    - cron: "0 10 1 * *"   # 10:00 UTC on the 1st ≈ 6am ET
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Run all nine industries sequentially
        run: |
          for industry in tree_service excavation septic concrete hvac plumbing electrical roofing landscaping; do
            echo "Starting $industry..."
            curl -fsS -X POST \
              "https://growth-os-2-production.up.railway.app/ingestion/runs" \
              -H "Content-Type: application/json" \
              -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
              -d "{\"industry\": \"$industry\", \"state\": \"CT\"}"
            echo ""
            sleep 900
          done
