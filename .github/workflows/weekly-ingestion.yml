name: Weekly CT ingestion sweep
# Re-sweeps all nine industries every Monday starting 6am ET.
# Existing businesses dedupe/merge; new ones get scored. 15 min between
# industries keeps runs sequential.
on:
  schedule:
    - cron: "0 10 * * 1"   # 10:00 UTC Monday ≈ 6am ET
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Run all nine industries sequentially
        run: |
          for industry in tree_service excavation septic concrete hvac plumbing electrical roofing landscaping; do
            echo "Starting $industry..."
            curl -fsS -X POST \
              "https://growth-os-2-production.up.railway.app/ingestion/runs" \
              -H "Content-Type: application/json" \
              -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
              -d "{\"industry\": \"$industry\", \"state\": \"CT\"}"
            echo ""
            sleep 900
          done
