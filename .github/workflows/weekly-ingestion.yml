name: CT ingestion sweep (manual)
# MANUAL ONLY — the automatic weekly cron was removed on purpose.
#
# Why: each full sweep is up to ~1,350 paid Google Places requests
# (9 industries x 50 cities x 3 pages). With 3,000+ businesses already
# banked and dedup merging almost everything a re-sweep returns, running
# this weekly spends real money for near-zero new inventory.
#
# Run it deliberately when you actually want new leads: GitHub → Actions →
# "CT ingestion sweep (manual)" → Run workflow. Good reasons to run:
# a new state, a new trade, or the hot-lead list running thin.
on:
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Run all nine industries sequentially
        run: |
          for industry in tree_service excavation septic concrete hvac plumbing electrical roofing landscaping; do
            echo "Starting $industry..."
            curl -fsS -X POST \
              "https://growth-os-2-production.up.railway.app/ingestion/runs" \
              -H "Content-Type: application/json" \
              -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
              -d "{\"industry\": \"$industry\", \"state\": \"CT\"}"
            echo ""
            sleep 900
          done
