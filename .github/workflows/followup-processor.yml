name: Follow-up processor
# Advances due outreach sequences. The endpoint itself enforces the
# send window (Mon-Fri 9-18 ET) and the daily warm-up cap, so this
# cron is safe to fire around the clock.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process due follow-ups
        run: |
          curl -fsS -X POST \
            "https://growth-os-2-production.up.railway.app/outreach/process-due" \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}"
